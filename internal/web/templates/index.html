<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<title>offerhound 🐕</title>
<link rel="icon" type="image/png" href="/assets/mascot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><img src="/assets/mascot.png" alt="" class="brand-mascot"> offerhound</div>
    <div id="banks" class="banks"></div>
    <select id="userSel" class="usersel" aria-label="Wallet"></select>
  </div>
</header>

<main>
  <div id="needsyou" class="needsyou hidden"></div>

  <div class="toolbar">
    <div class="searchwrap">
      <svg class="sicon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search"
             placeholder="Search merchants, rewards…" autofocus>
    </div>
    <div class="chips" id="channelChips">
      <button class="chip on" data-channel="">Everything</button>
      <button class="chip" data-channel="in-store">In-store</button>
      <button class="chip" data-channel="online">Online</button>
    </div>
    <span class="vdiv"></span>
    <div class="chips" id="statusChips">
      <button class="chip on" data-status="">Any status</button>
      <button class="chip" data-status="eligible">Not added</button>
      <button class="chip" data-status="enrolled">Added ✓</button>
    </div>
    <div class="chips" id="bankChips"></div>
  </div>

  <div id="meta" class="meta"></div>
  <div id="results" class="results"></div>
</main>

<div id="sheet" class="sheet hidden">
  <div class="sheet-inner">
    <div class="sheet-grab"></div>
    <div id="sheetBody"></div>
    <button id="sheetClose" class="btn">Close</button>
  </div>
</div>

<div id="humanSheet" class="sheet hidden">
  <div class="sheet-inner">
    <div class="sheet-grab"></div>
    <h2 id="humanPrompt"></h2>
    <input id="humanAnswer" inputmode="numeric" autocomplete="one-time-code"
           placeholder="Enter code / answer">
    <button id="humanSend" class="btn primary">Send answer</button>
  </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>

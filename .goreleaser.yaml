version: 2
project_name: offerhound
before:
  hooks:
    - go mod tidy
builds:
  - id: offerhound
    binary: offerhound
    main: ./cmd/offerhound
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - id: offerhound
    builds: [offerhound]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
release:
  github:
    owner: rajkumaar23
    name: offerhound

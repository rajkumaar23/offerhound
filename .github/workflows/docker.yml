name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Native-arch validation: the image must pass its own doctor,
      # including actually launching the bundled headless Chromium.
      - name: smoke test (amd64)
        run: |
          docker build -t oh-smoke --platform linux/amd64 .
          docker run --rm --entrypoint /usr/local/bin/offerhound oh-smoke doctor --live
          docker run -d --name oh-serve --platform linux/amd64 oh-smoke
          sleep 3
          docker exec oh-serve /usr/local/bin/offerhound doctor --probe http://127.0.0.1:8090/api/users || {
            echo "---- oh-serve logs ----"; docker logs oh-serve; exit 1;
          }
          docker rm -f oh-serve
